# XcodeGen 프로젝트 정의. GitHub Actions 의 macOS 러너에서 `xcodegen generate` 로 .xcodeproj 를 만든다.
# 로컬에 Xcode 가 없어도 이 파일과 소스만 있으면 된다.
name: FursuitFryday
options:
  bundleIdPrefix: com.kouga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # 기본은 무서명(컴파일 확인). TestFlight 빌드는 CI 가 자동 서명으로 덮어쓴다.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FursuitFryday:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "#FursuitFryday"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # HTTPS 외 암호화를 안 쓴다 — TestFlight 업로드 때 수출 규정 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 고른 앨범의 행사 사진을 불러와 사용 기록을 남기고, 요청하면 사진을 그 앨범에 담습니다. 사진 자체는 고치지 않습니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kouga.fursuitfryday
        PRODUCT_NAME: FursuitFryday
        # 아이폰 전용. XcodeGen 이 타깃마다 "1,2"(아이패드 포함)를 넣어서 여기서 다시 막는다.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "#FursuitFryday"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  FursuitFryday:
    build:
      targets:
        FursuitFryday: all
    run:
      config: Debug
    archive:
      config: Release
