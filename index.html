<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>#FursuitFryday</title>
<meta name="description" content="행사 사진에 행사·사진사·퍼슈트를 붙이고, 어느 컷을 올렸는지 기록합니다.">

<!-- iOS 웹앱 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="#FursuitFryday">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">

<!-- 폰트: 프리텐다드 한 계열로 통일.
     JP 를 먼저, 일반을 뒤에 받친다 — JP 에는 한글이 없고(가나·한자만)
     일반에는 한자가 435자뿐이라 어느 한쪽만으로는 두 언어를 다 못 받는다.
     통짜 woff2 는 JP 가 5.3MB 라 dynamic subset 을 쓴다. 119개 청크로
     쪼개져 있어 화면에 실제 나온 글자의 청크만 내려온다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div id="app">
  <!-- 로그인 게이트 -->
  <div class="gate" id="gate" hidden></div>

  <!-- 앱 셸 -->
  <div id="shell" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="screens">
      <section class="screen on" data-screen="home">
        <div class="hdr"><div class="hdr-row"><h1>모아보기</h1><span class="acts"><button class="act" id="home-sync">동기화</button></span></div></div>
        <div class="scroll" id="home-scroll"></div>
      </section>

      <section class="screen" data-screen="photos">
        <div class="hdr">
          <div class="hdr-row"><h1 id="ph-title">사진</h1><span class="acts"><button class="act ghost" id="flt-reset" hidden>필터 초기화</button><button class="act" id="sel-toggle">선택</button></span></div>
        </div>
        <div class="chips" id="ph-chips"></div>
        <div class="scroll" id="ph-scroll"></div>
      </section>

      <section class="screen" data-screen="schedule">
        <div class="hdr"><div class="hdr-row"><h1>일정</h1></div></div>
        <div class="scroll" id="sched-body"></div>
      </section>

      <section class="screen" data-screen="settings">
        <div class="hdr"><div class="hdr-row"><h1>설정</h1></div></div>
        <div class="scroll" id="set-body"></div>
      </section>
    </div>

    <div id="stack"></div>

    <nav class="tabbar" id="tabbar"></nav>

    <div class="selbar" id="selbar">
      <button id="sb-assign">행사·사진사</button>
      <button id="sb-more" class="pri">더보기</button>
    </div>
  </div>

  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
