<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>#FursuitFryday</title>
<meta name="description" content="행사 사진에 행사·사진사·퍼슈트를 붙이고, 어느 컷을 올렸는지 기록합니다.">

<!-- iOS 웹앱 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="#FursuitFryday">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<!-- 파비콘은 32px 을 따로 준다. 192px 을 브라우저가 줄이면 탭에서 흐릿해진다. -->
<link rel="icon" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" sizes="192x192" href="./icons/icon-192.png">

<!-- 폰트: 프리텐다드 한 계열로 통일.
     JP 를 먼저, 일반을 뒤에 받친다 — JP 에는 한글이 없고(가나·한자만)
     일반에는 한자가 435자뿐이라 어느 한쪽만으로는 두 언어를 다 못 받는다.
     통짜 woff2 는 JP 가 5.3MB 라 dynamic subset 을 쓴다. 119개 청크로
     쪼개져 있어 화면에 실제 나온 글자의 청크만 내려온다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 페인트를 막지 않게 받는다. 이 두 파일이 blocking 이던 동안 jsDelivr
     왕복 두 번이 첫 페인트 앞을 막고 있었다. 글자는 기본 서체로 먼저 뜨고
     프리텐다드가 오면 바뀐다(dynamic subset 이 font-display:swap 이다). -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./app.css">

<!-- 모듈을 미리 받는다.
     ES 모듈은 한 층을 파싱한 뒤에야 다음 층의 임포트를 발견한다. 그래서
     재 보니 파일 스무 개가 6파로 갈려 순차로 왕복했고(0→300→1000→1300→
     1600→1800→1900ms) 셸이 준비되기까지 2.1초가 걸렸다. 미리 알려 주면
     한꺼번에 받는다.
     demo.js·glass.js 는 빼 뒀다 — 조건부로만 불려서 미리 받으면 낭비다. -->
<link rel="modulepreload" href="./js/auth.js">
<link rel="modulepreload" href="./js/avatar.js">
<link rel="modulepreload" href="./js/config-load.js">
<link rel="modulepreload" href="./js/drive.js">
<link rel="modulepreload" href="./js/folderpick.js">
<link rel="modulepreload" href="./js/friday.js">
<link rel="modulepreload" href="./js/i18n.js">
<link rel="modulepreload" href="./js/imgutil.js">
<link rel="modulepreload" href="./js/schedule.js">
<link rel="modulepreload" href="./js/screens.js">
<link rel="modulepreload" href="./js/screens2.js">
<link rel="modulepreload" href="./js/store.js">
<link rel="modulepreload" href="./js/suggest.js">
<link rel="modulepreload" href="./js/suits.js">
<link rel="modulepreload" href="./js/thumbcache.js">
<link rel="modulepreload" href="./js/thumbs.js">
<link rel="modulepreload" href="./js/ui.js">
<link rel="modulepreload" href="./config.js">

<!-- 첫 페인트용 스플래시. 여기 스타일을 head 에 직접 두는 이유:
     app.css 조차 기다리지 않고 HTML 이 도착하는 즉시 그려져야 한다. -->
<style>
  /* app.css 보다 먼저 그려져야 하므로 여기 있는 것에만 의존한다.
     box-sizing 을 직접 정하는 이유: app.css 의 * 규칙에 기대면 그 파일이
     도착하는 순간 링 크기가 튄다. */
  #boot,#boot *{box-sizing:border-box}
  #boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#fff;margin:0;
    font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  #boot img{width:76px;height:76px;display:block}
  #boot .b-nm{font-size:17px;font-weight:700;letter-spacing:-.04em;color:#191F28}
  /* 로딩 서클. 한쪽만 색을 넣고 돌린다 — 테두리 하나로 끝나서 가볍다. */
  #boot .b-ring{flex:none;box-sizing:border-box;width:26px;height:26px;border-radius:50%;
    border:2.5px solid #E5E8EB;border-top-color:#3182F6;
    animation:bootspin .75s linear infinite}
  @keyframes bootspin{to{transform:rotate(360deg)}}
  /* 움직임을 줄이는 설정이면 천천히 돈다. 아예 멈추면 고장난 것처럼 보인다. */
  @media (prefers-reduced-motion:reduce){
    #boot .b-ring{animation-duration:2.4s}
  }
  /* JS 가 아예 못 뜬 경우. 순수 CSS 로만 나오므로 스크립트가 죽어도 보인다. */
  #boot .b-slow{margin-top:2px;font-size:13px;font-weight:600;color:#8B95A1;
    opacity:0;animation:bootslow .3s ease-out 10s forwards}
  @media (prefers-color-scheme:dark){
    #boot{background:#17171C}
    #boot .b-nm{color:#F7F8F9}
    #boot .b-ring{border-color:#2E2E38;border-top-color:#5A9EFF}
  }
  @keyframes bootslow{to{opacity:1}}
</style>
</head>
<body>

<div id="app">
  <!-- 첫 페인트. JS 가 게이트나 셸을 띄우는 순간 사라진다. -->
  <div id="boot">
    <img src="./icons/icon-180.png" alt="" width="76" height="76">
    <div class="b-nm">#FursuitFryday</div>
    <div class="b-ring"></div>
    <div class="b-slow">오래 걸리면 새로고침해 주세요</div>
  </div>

  <!-- 로그인 게이트 -->
  <div class="gate" id="gate" hidden></div>

  <!-- 앱 셸 -->
  <div id="shell" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="screens">
      <section class="screen on" data-screen="home">
        <div class="hdr"><div class="hdr-row"><h1>모아보기</h1><span class="acts"><span class="ago" id="home-ago"></span><button class="act" id="home-sync">동기화</button></span></div></div>
        <div class="scroll" id="home-scroll"></div>
      </section>

      <section class="screen" data-screen="photos">
        <div class="hdr">
          <div class="hdr-row"><h1 id="ph-title">사진</h1><span class="acts"><button class="act ghost" id="flt-reset" hidden>필터 초기화</button><button class="act" id="sel-toggle">선택</button></span></div>
        </div>
        <div class="chips" id="ph-chips"></div>
        <div class="scroll" id="ph-scroll"></div>
      </section>

      <section class="screen" data-screen="schedule">
        <div class="hdr"><div class="hdr-row"><h1>일정</h1></div></div>
        <div class="scroll" id="sched-body"></div>
      </section>

      <section class="screen" data-screen="profile">
        <div class="hdr"><div class="hdr-row"><h1>프로필</h1><span class="acts"><button class="act icon" id="prof-set" aria-label="설정"></button></span></div></div>
        <div class="scroll" id="prof-body"></div>
      </section>
    </div>

    <div id="stack"></div>

    <nav class="tabbar" id="tabbar"></nav>

    <div class="selbar" id="selbar">
      <button id="sb-assign">행사·사진사</button>
      <button id="sb-more" class="pri">더보기</button>
    </div>
  </div>

  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
